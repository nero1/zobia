name: Database Setup
on:
  workflow_dispatch:
    inputs:
      action:
        description: Apply migrations, or verify/adopt a schema previously installed manually
        required: true
        default: apply
        type: choice
        options: [apply, adopt]
permissions:
  contents: read
concurrency:
  group: database-setup
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply verified database setup
        env:
          DIRECT_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DB_CA_CERT: ${{ secrets.MIGRATION_DB_CA_CERT }}
          NODE_ENV: production
          MIGRATION_ACTION: ${{ inputs.action }}
        run: |
          test -n "$DIRECT_URL" || { echo 'Add MIGRATION_DATABASE_URL in GitHub Actions secrets first.'; exit 1; }
          case "$MIGRATION_ACTION" in
            apply) npm run migrate ;;
            adopt) npm run migrate -- --adopt-baseline ;;
            *) exit 1 ;;
          esac
