name: Integration Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps/web/**'
      - '!apps/web/**/*.md'
      - 'shared/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '!apps/web/**/*.md'
      - 'shared/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    # PostgreSQL service container — all migrations applied before tests run
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zobia_test
          POSTGRES_USER: zobia
          POSTGRES_PASSWORD: zobia_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://zobia:zobia_test_pw@localhost:5432/zobia_test
      SKIP_ENV_VALIDATION: "1"
      NODE_ENV: test

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Check localization coverage and client parity
        run: |
          node ../../scripts/audit-i18n.mjs --check
          node ../../scripts/sync-i18n.mjs --check

      - name: Verify PostgreSQL baseline portability and grants
        run: BASELINE_PORTABILITY_TEST=1 npx tsx db/test-baseline-portability.ts

      - name: Verify optional SQL Editor starter content
        env:
          TEST_ADMIN_DATABASE_URL: postgres://zobia:zobia_test_pw@localhost:5432/postgres
        run: npx tsx scripts/test-starter-content.ts

      - name: Verify provider and SQL Editor baseline adoption
        env:
          TEST_ADMIN_DATABASE_URL: postgres://zobia:zobia_test_pw@localhost:5432/postgres
        run: npx tsx db/test-platform-adoption.ts

      - name: Verify read-only schema diagnostics
        env:
          TEST_ADMIN_DATABASE_URL: postgres://zobia:zobia_test_pw@localhost:5432/postgres
        run: npx tsx db/test-schema-diagnostics.ts

      - name: Verify v3 security and Tales contracts
        env:
          TEST_ADMIN_DATABASE_URL: postgres://zobia:zobia_test_pw@localhost:5432/postgres
        run: npx tsx scripts/test-v3-contracts.ts

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Verify complete Drizzle database contract
        run: npx tsx db/check-schema.ts

  drizzle-schema-check:
    name: Drizzle Schema Consistency
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check (catches schema type mismatches)
        run: npm run type-check

      - name: Drizzle schema validation
        run: npx drizzle-kit check
        env:
          DATABASE_URL: ""
