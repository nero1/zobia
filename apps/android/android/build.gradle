buildscript {
    ext { buildToolsVersion = "34.0.0" }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        // Reads app/google-services.json and generates the resources FirebaseApp
        // needs to auto-initialize at process start — without this, any call into
        // Firebase (e.g. @capacitor/push-notifications' FCM registration) throws
        // "Default FirebaseApp is not initialized" and crashes the app. See
        // docs/SETUP.md "Push Notifications (Capacitor Android / FCM)".
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

// Single source of truth for SDK levels / library versions consumed by
// app/build.gradle and by every native Capacitor/Cordova plugin submodule's
// own build.gradle (they read rootProject.ext.compileSdkVersion etc. and
// silently fall back to stale defaults, e.g. compileSdk 34, if this isn't
// applied at the root — see docs/SETUP.md "Android native project structure").
apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
