apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.zobiasocial.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.zobiasocial.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // versionCode/versionName are supplied by CI via -PversionCode=/-PversionName=
        // (see .github/workflows/android-build.yml) so each new Play Store upload
        // strictly increases versionCode as required. The literal fallbacks below
        // only apply to local `./gradlew` runs where those properties aren't passed.
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1)
        versionName (project.hasProperty('versionName') ? project.property('versionName') : "1.0.0")
    }

    // ZB-AND-13 fix: release signing config, read from Gradle properties so no
    // real keystore/credentials are ever committed. android-build.yml's
    // "release" job decodes the base64 keystore secret to a temp file and
    // passes these four properties at build time; `hasProperty` guards mean a
    // plain local `./gradlew assembleRelease` (no properties passed) falls
    // back to unsigned, rather than failing the unrelated debug build.
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig project.hasProperty('RELEASE_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Keystore-backed EncryptedSharedPreferences for SecureTokenStorePlugin.java
    // (JWT/refresh token storage) — see that file's doc comment.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Auto-generated (and re-committed) by `cap sync` — wires in every Capacitor
// + Cordova plugin's native module (project(':...') deps + any 3rd-party AARs
// like the Play Billing client) so adding/removing a plugin never requires a
// manual edit here. Must stay LAST — it depends on the `android {}` block above.
apply from: "capacitor.build.gradle"
