android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36

# Gradle JVM heap.
#
# Without this, Gradle runs on the JVM's default max heap (a fraction of the
# runner's RAM, well under 1 GB on a GitHub Actions runner). The APK packaging
# step reads entire entries into memory via zipflinger, so `assembleDebug`
# died with `java.lang.OutOfMemoryError: Java heap space` in CI as soon as the
# bundle grew past that ceiling — the Vite output is ~3 MB and climbing.
#
# 4 GB is comfortably within a standard GitHub runner (16 GB) and a typical dev
# machine. MaxMetaspaceSize is set alongside it because the default metaspace
# is also unbounded-until-it-is-not under the Android Gradle Plugin's heavy
# annotation processing, and an unbounded metaspace is what turns a heap
# problem into a confusing native-memory one.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
